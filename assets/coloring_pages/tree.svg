<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Simple tree coloring page -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Tree trunk -->
    <rect x="130" y="180" width="40" height="80"/>

    <!-- Trunk texture lines -->
    <line x1="140" y1="190" x2="145" y2="195"/>
    <line x1="155" y1="200" x2="160" y2="205"/>
    <line x1="135" y1="220" x2="140" y2="225"/>
    <line x1="160" y1="235" x2="165" y2="240"/>

    <!-- Bottom foliage layer -->
    <ellipse cx="150" cy="180" rx="70" ry="40"/>

    <!-- Middle foliage layer -->
    <ellipse cx="150" cy="140" rx="60" ry="40"/>

    <!-- Top foliage layer -->
    <ellipse cx="150" cy="100" rx="50" ry="35"/>

    <!-- Apples or fruits on tree -->
    <circle cx="120" cy="150" r="6"/>
    <circle cx="180" cy="150" r="6"/>
    <circle cx="150" cy="120" r="6"/>
    <circle cx="130" cy="130" r="6"/>
    <circle cx="170" cy="130" r="6"/>
    <circle cx="140" cy="170" r="6"/>
    <circle cx="160" cy="165" r="6"/>

    <!-- Ground -->
    <line x1="50" y1="260" x2="250" y2="260"/>

    <!-- Grass tufts -->
    <path d="M 100 260 Q 95 250 90 245"/>
    <path d="M 105 260 Q 105 250 105 240"/>
    <path d="M 110 260 Q 115 250 120 245"/>

    <path d="M 180 260 Q 175 250 170 245"/>
    <path d="M 185 260 Q 185 250 185 240"/>
    <path d="M 190 260 Q 195 250 200 245"/>

    <!-- Small flowers at base -->
    <circle cx="110" cy="255" r="4"/>
    <circle cx="190" cy="255" r="4"/>
  </g>
</svg>
