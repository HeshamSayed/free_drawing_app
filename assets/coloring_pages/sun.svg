<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Simple sun coloring page -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Sun center -->
    <circle cx="150" cy="150" r="50"/>

    <!-- Happy face -->
    <circle cx="135" cy="140" r="5"/>
    <circle cx="165" cy="140" r="5"/>
    <path d="M 130 165 Q 150 175 170 165"/>

    <!-- Sun rays (12 rays) -->
    <!-- Top -->
    <line x1="150" y1="90" x2="150" y2="50"/>
    <!-- Top right -->
    <line x1="185.5" y1="114.5" x2="212.5" y2="87.5"/>
    <!-- Right -->
    <line x1="210" y1="150" x2="250" y2="150"/>
    <!-- Bottom right -->
    <line x1="185.5" y1="185.5" x2="212.5" y2="212.5"/>
    <!-- Bottom -->
    <line x1="150" y1="210" x2="150" y2="250"/>
    <!-- Bottom left -->
    <line x1="114.5" y1="185.5" x2="87.5" y2="212.5"/>
    <!-- Left -->
    <line x1="90" y1="150" x2="50" y2="150"/>
    <!-- Top left -->
    <line x1="114.5" y1="114.5" x2="87.5" y2="87.5"/>

    <!-- Diagonal rays (between main rays) -->
    <!-- Top-top-right -->
    <line x1="169" y1="106" x2="184" y2="75"/>
    <!-- Right-right-top -->
    <line x1="194" y1="131" x2="225" y2="116"/>
    <!-- Right-right-bottom -->
    <line x1="194" y1="169" x2="225" y2="184"/>
    <!-- Bottom-bottom-right -->
    <line x1="169" y1="194" x2="184" y2="225"/>
    <!-- Bottom-bottom-left -->
    <line x1="131" y1="194" x2="116" y2="225"/>
    <!-- Left-left-bottom -->
    <line x1="106" y1="169" x2="75" y2="184"/>
    <!-- Left-left-top -->
    <line x1="106" y1="131" x2="75" y2="116"/>
    <!-- Top-top-left -->
    <line x1="131" y1="106" x2="116" y2="75"/>
  </g>
</svg>
