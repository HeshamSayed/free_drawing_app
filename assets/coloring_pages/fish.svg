<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Simple fish coloring page -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Fish body (oval) -->
    <ellipse cx="150" cy="150" rx="70" ry="45"/>

    <!-- Tail -->
    <path d="M 220 150 L 260 130 L 250 150 L 260 170 Z"/>

    <!-- Top fin -->
    <path d="M 130 105 Q 120 80 130 70 L 140 105"/>

    <!-- Bottom fin -->
    <path d="M 140 195 Q 130 220 140 230 L 150 195"/>

    <!-- Side fin -->
    <path d="M 120 160 Q 100 180 90 175 Q 100 170 120 165"/>

    <!-- Eye -->
    <circle cx="110" cy="135" r="10"/>
    <circle cx="110" cy="135" r="5"/>

    <!-- Mouth -->
    <path d="M 85 150 Q 90 155 95 150"/>

    <!-- Scales pattern -->
    <path d="M 130 130 Q 140 125 150 130"/>
    <path d="M 130 145 Q 140 140 150 145"/>
    <path d="M 130 160 Q 140 155 150 160"/>
    <path d="M 130 175 Q 140 170 150 175"/>

    <path d="M 150 130 Q 160 125 170 130"/>
    <path d="M 150 145 Q 160 140 170 145"/>
    <path d="M 150 160 Q 160 155 170 160"/>
    <path d="M 150 175 Q 160 170 170 175"/>

    <path d="M 170 130 Q 180 125 190 130"/>
    <path d="M 170 145 Q 180 140 190 145"/>
    <path d="M 170 160 Q 180 155 190 160"/>
    <path d="M 170 175 Q 180 170 190 175"/>

    <!-- Bubbles -->
    <circle cx="60" cy="100" r="8"/>
    <circle cx="50" cy="85" r="6"/>
    <circle cx="40" cy="95" r="5"/>
    <circle cx="70" cy="80" r="7"/>

    <circle cx="250" cy="200" r="6"/>
    <circle cx="260" cy="215" r="5"/>
    <circle cx="240" cy="220" r="4"/>

    <!-- Water plants -->
    <path d="M 30 250 Q 35 230 30 210 Q 25 230 30 250"/>
    <path d="M 270 250 Q 265 230 270 210 Q 275 230 270 250"/>
  </g>
</svg>
