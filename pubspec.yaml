name: artjoy
description: ArtJoy - Free Drawing & Coloring Game for Kids
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Ads
  google_mobile_ads: ^5.0.0

  # UI & Animations
  rive: ^0.12.4
  lottie: ^3.0.0
  flutter_colorpicker: ^1.0.3

  # Image Handling
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.1.0
  screenshot: ^2.3.0

  # Audio
  audioplayers: ^5.2.1

  # Utils
  uuid: ^4.2.1
  intl: ^0.19.0
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/animations/
    - assets/coloring_pages/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
